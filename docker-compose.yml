services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_hunter
      POSTGRES_USER: job_hunter
      POSTGRES_PASSWORD: job_hunter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunter -d job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
